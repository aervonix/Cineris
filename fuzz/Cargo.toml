# Coverage-guided fuzzing of the stream decoders, the outline extractors and
# the RPC server's decoder (docs/testing-and-ci.md, "Not blocking"). Run by
# the nightly workflow, and by hand:
#
#   cargo xtask fuzz [--seconds N] [TARGET…]
#
# It is not a member of the workspace. The fuzzer needs a nightly compiler
# and a C++ compiler for its runtime, and neither belongs in the blocking
# checks or in what ships. The package has its own lockfile, and its own
# toolchain file, which pins the nightly to a date.
[package]
name = "cortex-fuzz"
description = "Fuzz targets for the stream decoders, the outline extractors and the RPC server's decoder of Cortex-Harness. Not shipped."
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[lib]
doctest = false

[dependencies]
# The framing, and what the RPC server's `wire.rs` uses, which `src/lib.rs`
# compiles from its own file in place of depending on `cortex-rpc`: with
# `serde` and `serde_json`, each in the build already through the others.
cortex-base = { path = "../crates/cortex-base" }
cortex-index = { path = "../crates/cortex-index" }
cortex-llm = { path = "../crates/cortex-llm", default-features = false }
cortex-protocol = { path = "../crates/cortex-protocol" }
libfuzzer-sys = "0.4.13"
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.145", default-features = false, features = ["std"] }

[[bin]]
name = "sse_parser"
path = "fuzz_targets/sse_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "anthropic_decoder"
path = "fuzz_targets/anthropic_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "openai_chat_decoder"
path = "fuzz_targets/openai_chat_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "extractors"
path = "fuzz_targets/extractors.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rpc_decoder"
path = "fuzz_targets/rpc_decoder.rs"
test = false
doc = false
bench = false

# Its own workspace: the repository's is not to grow a nightly-only member.
[workspace]
