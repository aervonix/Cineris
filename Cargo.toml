[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/aervonix/Cineris"

# One table, so each crate has one version and one feature set.
# Every third-party entry also needs a row in docs/dependencies.md
# (`cargo xtask rules` fails when the two disagree).
[workspace.dependencies]
# Workspace crates. Which crate may depend on which is fixed by
# docs/architecture/01-workspace.md and checked by `cargo xtask rules`.
cineris-agent = { path = "crates/cineris-agent" }
cineris-base = { path = "crates/cineris-base" }
cineris-config = { path = "crates/cineris-config" }
cineris-core = { path = "crates/cineris-core" }
cineris-ext = { path = "crates/cineris-ext" }
cineris-index = { path = "crates/cineris-index" }
cineris-knowledge = { path = "crates/cineris-knowledge" }
# Default features are off here so that a crate has to ask for the HTTP stack.
cineris-llm = { path = "crates/cineris-llm", default-features = false }
cineris-mcp = { path = "crates/cineris-mcp" }
cineris-policy = { path = "crates/cineris-policy" }
cineris-protocol = { path = "crates/cineris-protocol" }
cineris-rpc = { path = "crates/cineris-rpc" }
cineris-sandbox = { path = "crates/cineris-sandbox" }
cineris-session = { path = "crates/cineris-session" }
cineris-stats = { path = "crates/cineris-stats" }
cineris-term = { path = "crates/cineris-term" }
cineris-testkit = { path = "crates/cineris-testkit" }
cineris-tools = { path = "crates/cineris-tools" }
cineris-tui = { path = "crates/cineris-tui" }

# Third-party crates. Default features off; opt in to what is used.
futures-core = { version = "0.3.34", default-features = false, features = ["std"] }
globset = { version = "0.4.21", default-features = false }
grep-matcher = { version = "0.1.9", default-features = false }
grep-regex = { version = "0.1.14", default-features = false }
grep-searcher = { version = "0.1.17", default-features = false }
ignore = { version = "0.4.34", default-features = false }
# Held at 1.0, the adapter that refuses a host name with letters outside
# ASCII instead of mapping it through ICU's tables (decision 0036): about
# 135 KB less binary and 21 fewer crates. `url` asks for `idna_adapter =
# "1"`, so without this requirement `cargo update` would move it to the
# newest 1.x and bring ICU back. `cineris-llm` names it for this alone, and
# a test of its transport fails if it moves.
idna_adapter = { version = "~1.0.0", default-features = false }
keyring-core = { version = "1.0.1", default-features = false }
# The Linux sandbox's file-system rules (step 26). It has no features.
landlock = { version = "0.4.7", default-features = false }
# The command line (decision 0011): a lexer for arguments. It has no features.
lexopt = { version = "0.3.1", default-features = false }
libc = { version = "0.2.191", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "rustls-no-provider"] }
# The script engine (decision 0005): QuickJS, behind `cineris-ext`'s
# `scripts` feature. `std`, and `loader` for the trait a module loader of our
# own implements (imports resolve only inside the extension's snapshot). No
# futures runtime, no macros.
rquickjs = { version = "0.14.0", default-features = false, features = ["std", "loader"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# The system's root certificates for extensions' fetch client, read from the
# system's own store with nothing fetched (step 28). It has no features.
rustls-native-certs = { version = "0.8.5", default-features = false }
schemars = { version = "1.2.3", default-features = false, features = ["derive", "std"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.145", default-features = false, features = ["std"] }
sha2 = { version = "0.11.1", default-features = false }
similar = { version = "3.2.1", default-features = false, features = ["std"] }
thiserror = { version = "2.0.21", default-features = false, features = ["std"] }
# Syntax highlighting, behind `cineris-tui`'s `highlight` feature (decision
# 0015): the packed default grammars and the pure-Rust regex engine. No
# themes, no loading of grammar files, no HTML.
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
# The Linux sandbox's system-call filter (step 26). Without `json`, which
# brings serde for filters written as data.
seccompiler = { version = "0.5.0", default-features = false }
# Each crate names the tokio features it uses; none are on here.
tokio = { version = "1.54.1", default-features = false }
# The logging facade (decision 0019). Without `attributes`, which is a
# procedural macro nothing here uses. `trace` is compiled out of release
# builds.
tracing = { version = "0.1.44", default-features = false, features = ["std", "release_max_level_debug"] }
# One type of it that `tracing` does not re-export: what a subscriber answers
# when asked for the current span. `tracing` builds it anyway.
tracing-core = { version = "0.1.36", default-features = false, features = ["std"] }
# Reading only. A crate that also writes TOML turns `display` on itself.
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde", "std"] }
unicode-segmentation = { version = "1.13.3", default-features = false }
unicode-width = { version = "0.2.3", default-features = false }
# Without `search`, which brings a regular-expression engine for a listing
# of stored credentials that nothing here asks for.
windows-native-keyring-store = { version = "1.1.0", default-features = false }
# No features here: each crate that uses it names the API families it calls.
windows-sys = { version = "0.61.2", default-features = false }

# The nightly unused-dependency check (`cargo xtask unused`, cargo-machete)
# looks at third-party crates only, for now. The skeleton declares the edges
# between workspace crates that docs/architecture/01-workspace.md gives each
# crate, before the code that uses them exists, so every one of them would be
# reported. Which crate may depend on which is checked by `cargo xtask rules`.
# Remove a name from this list when the crates that depend on it have code,
# and the whole table once the first release's crates are built.
[workspace.metadata.cargo-machete]
ignored = [
    "cineris-agent",
    "cineris-base",
    "cineris-config",
    "cineris-core",
    "cineris-ext",
    "cineris-index",
    "cineris-knowledge",
    "cineris-llm",
    "cineris-mcp",
    "cineris-policy",
    "cineris-protocol",
    "cineris-rpc",
    "cineris-sandbox",
    "cineris-session",
    "cineris-stats",
    "cineris-term",
    "cineris-testkit",
    "cineris-tools",
    "cineris-tui",
]

[workspace.lints.rust]
# Allowed per module in cineris-sandbox and cineris-term, where the OS
# interfaces need it, in one Windows-only module of cineris-base
# (`private::windows`, which sets access lists; decision 0029), and in one of
# cineris-rpc (`socket::windows`, the named pipe; decision 0037). Nowhere else.
# Every block has a safety comment.
unsafe_code = "deny"
# Public items are documented: part of "done" for every step.
missing_docs = "warn"
missing_debug_implementations = "warn"
# `pub` that cannot be reached from outside the crate should say `pub(crate)`.
unreachable_pub = "warn"

[workspace.lints.clippy]
# The project rules from docs/testing-and-ci.md. The lists they use are in
# clippy.toml. CI turns every warning into an error.
#
# Blocking standard-library calls must not run on the core thread.
disallowed_methods = "warn"
disallowed_types = "warn"
# No unwrap or expect outside tests, unless an attribute gives the invariant:
#   #[expect(clippy::unwrap_used, reason = "the regex is a literal")]
unwrap_used = "warn"
expect_used = "warn"
# Nothing writes to standard output or standard error by accident.
# cineris-cli and xtask are the two crates that allow these.
print_stdout = "warn"
print_stderr = "warn"
# Every unsafe block says why it is sound.
undocumented_unsafe_blocks = "warn"
# An exception to a lint always carries its reason.
allow_attributes_without_reason = "warn"
# Nothing unfinished reaches the main branch.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# Exiting the process skips terminal restoration. Return an exit code instead.
exit = "warn"

# The profiles are decision 0012 (docs/decisions/0012-release-profile.md).
# `panic = "unwind"` is Cargo's default and is what every profile uses:
# a panic in a tool task or an extension call is caught at the task boundary.
[profile.dev]
debug = "line-tables-only"

# Third-party crates: lightly optimised, no debug info.
[profile.dev.package."*"]
opt-level = 1
debug = false

# What the blocking CI test jobs and `cargo xtask ci` build with: `dev`, with
# third-party crates unoptimised. Optimising them is worth it at a desk, where
# they are built once and kept. On a hosted runner with a cold cache it is the
# difference between fitting in 5 minutes and not: a clean build of the
# planned dependency set took 129 s on Linux and 259 s on Windows with
# opt-level 1, and 27 to 45 s and 60 to 82 s with opt-level 0
# (docs/testing-and-ci.md). Our own crates are built without debug info
# too, since the CI-budgets fix: their line tables cost a Windows runner's
# cold build 19.7 s of 187 (a job A/B, two rounds, one in each order: `try`
# 44634824935). A failing test's panic still names its file and line; only
# a backtrace loses its line numbers. To have them back, build in `dev`, or
# set CARGO_PROFILE_CI_DEBUG=line-tables-only.
[profile.ci]
inherits = "dev"
debug = false

[profile.ci.package."*"]
opt-level = 0
debug = false

# The exceptions, each a crate that tests spend whole seconds in when it is
# unoptimised: the JSON reader under every decoder replay and session log
# test, and the hash under every file a tool reads. They are third-party, so
# they are built once and served from the cache after that.
[profile.ci.package.serde_json]
opt-level = 2

[profile.ci.package.sha2]
opt-level = 2

# And syntect, with what it loads its grammars with: each highlighter test
# and the golden screens load them once a process, which takes 0.09 s
# unoptimised and 0.02 s optimised on the desktop (step 22).
[profile.ci.package.syntect]
opt-level = 2

[profile.ci.package.fancy-regex]
opt-level = 2

[profile.ci.package.regex-automata]
opt-level = 2

[profile.ci.package.regex-syntax]
opt-level = 2

[profile.ci.package.miniz_oxide]
opt-level = 2

[profile.ci.package.flate2]
opt-level = 2

[profile.ci.package.bincode]
opt-level = 2

# Optimised for size, as the shipped binary is (decision 0036): `dist`
# inherits the level, so every measurement made in `release` (`cargo xtask
# perf`, the `perf_` tests, `try -f profile=release`) runs code optimised as
# the shipped binary's is. What differs from `dist` is only the linking:
# thin LTO over 16 units, which builds in a fraction of the time.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 16
debug = false

# Published binaries. Build them with `cargo xtask size` (or, from step 34,
# `cargo xtask dist`), which also takes the build machine's folders out of
# the paths the binary holds (decision 0036); a plain `cargo build --profile
# dist` does not.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
