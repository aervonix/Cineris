[package]
name = "cineris-core"
description = "Wires every part into a Core that accepts operations and emits events. The only crate that knows all the parts."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
doctest = false

[features]
default = ["mcp", "sandbox", "scripts"]
# Links the MCP client.
mcp = ["dep:cineris-mcp"]
# Links the script engine in `cineris-ext` (decision 0005). Without it no
# extension is loaded: none of its tools, commands or hooks is in a session,
# and each one that stands approved holds its gating hooks on their events,
# failing, so that its gates do not lapse. Custom command files and the
# configuration's hook commands work as they do with it. A session has no
# skills for now: they are found on the extensions' finding, which needs it.
scripts = ["cineris-ext/scripts"]
# Links the OS sandbox's backends (Landlock and seccomp on Linux). Without it
# every session reports the sandbox off, and `autonomous` is refused.
sandbox = ["cineris-sandbox/backends"]

[dependencies]
cineris-protocol.workspace = true
cineris-base.workspace = true
cineris-llm = { workspace = true, features = ["http"] }
cineris-tools.workspace = true
cineris-sandbox.workspace = true
cineris-policy.workspace = true
cineris-session.workspace = true
cineris-config.workspace = true
cineris-stats.workspace = true
cineris-knowledge.workspace = true
cineris-index.workspace = true
cineris-agent.workspace = true
cineris-ext.workspace = true
cineris-mcp = { workspace = true, optional = true }

serde_json.workspace = true
toml = { workspace = true, features = ["display"] }
tracing.workspace = true
# The runtime the core's tasks run on: `rt` for tasks and the blocking pool,
# `sync` for the wake-ups of a client's queue. The timer is not asked of
# it here: every wait is on `cineris_base::Timer`.
tokio = { workspace = true, features = ["rt", "sync"] }

[dev-dependencies]
# An engine's parts with sane defaults, for the unit tests of the policy.
cineris-policy = { workspace = true, features = ["test-support"] }
cineris-testkit.workspace = true
# The seam that puts the loop's blocking work on the test's own thread, in
# a seeded order (`docs/testing-and-ci.md`, "A seeded order of events").
cineris-tools = { workspace = true, features = ["test-hooks"] }
# A server's tools registered as its lifecycle registers them, from the MCP
# client's fake server (`test-kit`), in every build of the tests.
cineris-mcp = { workspace = true, features = ["test-kit"] }

[lints]
workspace = true
