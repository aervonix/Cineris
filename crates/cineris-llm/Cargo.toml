[package]
name = "cineris-llm"
description = "The provider abstraction: model requests and events, the protocol and transport traits, the SSE parser, retries, usage normalisation, the model catalog, and the fetch client behind extensions' fetch."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
doctest = false

[features]
default = ["http"]
# The real HTTP transport and the timer that goes with it. Off for crates
# that only need the types and traits: nothing else in this crate links an
# async runtime or a network stack.
http = ["dep:idna_adapter", "dep:reqwest", "dep:rustls", "dep:rustls-native-certs", "dep:tokio"]

[dependencies]
cineris-protocol.workspace = true
cineris-base.workspace = true
futures-core.workspace = true
serde.workspace = true
# `raw_value`: a block of a response is kept as the text the provider sent,
# so that replaying it changes nothing (src/anthropic/decode.rs).
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
reqwest = { workspace = true, optional = true }
# Not used by name: it holds the version `url`, under `reqwest`, gets
# (root Cargo.toml).
idna_adapter = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
# The fetch client's roots: rustls checks a server's certificate against
# them and fetches nothing (src/fetch.rs).
rustls-native-certs = { workspace = true, optional = true }
# `rt`: the fetch client looks names up, and makes its HTTP clients, on the
# blocking pool (src/fetch.rs).
tokio = { workspace = true, optional = true, features = ["rt", "time"] }

[build-dependencies]
# The catalog is written in TOML and embedded as JSON (build.rs).
serde_json.workspace = true
toml.workspace = true

[dev-dependencies]
cineris-testkit.workspace = true
tokio = { workspace = true, features = ["rt"] }

# `idna_adapter` is named only to hold its version (root Cargo.toml).
[package.metadata.cargo-machete]
ignored = ["idna_adapter"]

[lints]
workspace = true
