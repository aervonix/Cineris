[package]
name = "cortex-policy"
description = "Levels and leases, permission rules, shell-command analysis, approval bookkeeping and project trust."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
cortex-protocol.workspace = true
cortex-base.workspace = true
serde.workspace = true
thiserror.workspace = true
# The stored approvals and the trust store are TOML files in the state
# directory (docs/architecture/08-configuration.md, "Other state").
toml = { workspace = true, features = ["display"] }

[features]
# Code for tests only: `test_support::TestParts`, an engine's parts with
# sane defaults for the tests of this crate and of the crates that make an
# engine. Only dev-dependencies turn it on (`cargo xtask rules`).
test-support = []

[dev-dependencies]
# This crate's own integration tests ask for its own `test-support`. Not an
# edge of the crate table.
cortex-policy = { workspace = true, features = ["test-support"] }
cortex-testkit.workspace = true
serde_json.workspace = true

[lints]
workspace = true
