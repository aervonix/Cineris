[package]
name = "cineris-agent"
description = "The agent loop: the turn state machine, the tool scheduler, the steering queue, verification, context assembly and compaction."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
cineris-protocol.workspace = true
cineris-base.workspace = true
# The types and traits only: the loop never names a transport.
cineris-llm.workspace = true
cineris-tools.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The `turn`, `request` and `tool` spans (docs/architecture/02-runtime.md,
# "Logging and tracing"). With no subscriber, a span is a check of one atomic.
tracing.workspace = true
# `rt` for tasks (a tool call, a plan, a question each run as one), `sync`
# for the channel they report on and for waking an idle session.
tokio = { workspace = true, features = ["rt", "sync"] }

[dev-dependencies]
cineris-testkit.workspace = true
# The tests run the loop under a seeded order of events (`tests/it/main.rs`,
# `World`), which is this feature of the tools crate.
cineris-tools = { workspace = true, features = ["test-hooks"] }

[lints]
workspace = true
