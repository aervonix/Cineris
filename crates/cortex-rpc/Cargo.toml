[package]
name = "cortex-rpc"
description = "The JSON-RPC server over standard I/O and local sockets, on top of the core."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
cortex-protocol.workspace = true
cortex-base.workspace = true
cortex-core.workspace = true

serde.workspace = true
serde_json.workspace = true
# Every task of a connection runs on the core thread's runtime (`rt`); the
# channels to the transport and the wake-ups of the writer (`sync`); the
# local socket and the named pipe (`net`) and their halves read and written
# (`io-util`), both in the build already through the HTTP client. The timer
# is not asked of it: every wait is on `cortex_base::Timer`.
tokio = { workspace = true, features = ["rt", "sync", "net", "io-util"] }
tracing.workspace = true

# The named pipe of `serve --socket` (docs/steps/27/answered.md, "The
# design, before building", point 1): each instance made with its security
# descriptor (`Win32_System_Pipes`, with the flags of `Win32_Storage_FileSystem`
# and the descriptor's text read by `Win32_Security_Authorization`), and each
# connection's token checked (`Win32_Security`, and `Win32_System_Threading`
# for the thread's token), and the server's own commands told by the job they
# are in (`Win32_System_JobObjects`). Used by one module, `socket::windows`,
# the only place in this crate where `unsafe` is allowed.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[features]
# Test only: a listener whose pipe admits everyone, so that a test shows the
# check of a connection's token by itself (`ListenOptions`). Turned on by a
# dev-dependency and by nothing else (`cargo xtask rules`).
test-hooks = []

[dev-dependencies]
cortex-rpc = { path = ".", features = ["test-hooks"] }
cortex-testkit.workspace = true
# A core for the tests only, as the binary makes one: its configuration's
# environment (`cortex-config`), and its shell and process runner on the
# fake timer (`cortex-tools`).
cortex-config.workspace = true
cortex-tools.workspace = true

# The pipe's tests make the clients it must refuse: a token below the
# server's integrity, a restricted one, a second user logged on, each
# impersonated by a thread of the test; and they read the pipe's security
# back, and wait for an instance of the pipe (`Win32_System_Pipes`). The
# integrity's flag is `Win32_System_SystemServices`'.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[lints]
workspace = true
