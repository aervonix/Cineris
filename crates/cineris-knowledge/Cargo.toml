[package]
name = "cineris-knowledge"
description = "The project profile and project memory: entries, provenance, expiry, the two stores, the command observer and rendering for the prompt."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
cineris-protocol.workspace = true
cineris-base.workspace = true
serde.workspace = true
thiserror.workspace = true
# The private store and the shared profile are TOML files that a person can
# read and edit (docs/architecture/14-adaptation.md, "Where it lives").
toml = { workspace = true, features = ["display"] }
# One warning: the good copy of the store could not be written.
tracing.workspace = true

[dev-dependencies]
cineris-testkit.workspace = true

[lints]
workspace = true
