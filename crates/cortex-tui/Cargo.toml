[package]
name = "cortex-tui"
description = "The interactive UI: transcript, editor, dialogs, hint row, slash commands and themes."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
doctest = false

[features]
default = ["highlight"]
# Syntax highlighting of code blocks, with syntect, loaded on first use on a
# thread of its own (decision 0015).
highlight = ["dep:syntect"]
# The editor demo (`cargo run --release -p cortex-tui --example editor-demo
# --features demo`), for measuring key latency with the editor in the loop.
# A feature of its own so that test builds do not link it.
demo = []

[dependencies]
cortex-protocol.workspace = true
cortex-base.workspace = true
cortex-term.workspace = true
# The payloads of tool results and the arguments of tool calls, which the
# protocol carries as JSON values.
serde_json.workspace = true
syntect = { workspace = true, optional = true }

[dev-dependencies]
cortex-testkit.workspace = true

[[example]]
name = "editor-demo"
path = "examples/editor-demo/main.rs"
required-features = ["demo"]

[lints]
workspace = true
