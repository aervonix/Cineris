[package]
name = "cineris-policy"
description = "Levels and leases, permission rules, shell-command analysis, approval bookkeeping and project trust."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
cineris-protocol.workspace = true
cineris-base.workspace = true
serde.workspace = true
thiserror.workspace = true
# The stored approvals, the trust store and the user's pins are TOML files
# in the state directory (docs/architecture/08-configuration.md, "Other state").
toml = { workspace = true, features = ["display"] }
# The approvals key (the signed approvals step, docs/dependencies.md):
# Argon2id of the person's password, Ed25519 and HKDF from `ring`, and
# `zeroize` to wipe what is made from the password.
argon2.workspace = true
ring.workspace = true
zeroize.workspace = true

[features]
# Code for tests only: `test_support::TestParts`, an engine's parts with
# sane defaults for the tests of this crate and of the crates that make an
# engine. Only dev-dependencies turn it on (`cargo xtask rules`).
test-support = []

[dev-dependencies]
# This crate's own integration tests ask for its own `test-support`. Not an
# edge of the crate table.
cineris-policy = { workspace = true, features = ["test-support"] }
cineris-testkit.workspace = true
serde_json.workspace = true

[lints]
workspace = true
