[package]
name = "cortex-stats"
description = "Local statistics: event recording, monthly files, aggregates and retention."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
doctest = false

[features]
# For tests only: `synthetic`, which fills a statistics directory with a
# made-up month of events by a seed, through the real recorder
# (`src/synthetic.rs`). Only a dev-dependency may turn it on, which
# `cargo xtask rules` checks. The crate's own tests have it without the
# feature.
test-hooks = []

[dependencies]
cortex-protocol.workspace = true
cortex-base.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
cortex-testkit.workspace = true

[lints]
workspace = true
