[package]
name = "cineris-ext"
description = "The extension host: custom commands, skills, hooks, the script runtime and its host functions, trust pinning and extension authoring."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
doctest = false

[features]
# Links the script engine (decision 0005). `cineris-core`'s `scripts` turns
# it on. Without it, extensions are custom commands, skills and hook
# commands.
scripts = ["dep:rquickjs"]

[dependencies]
cineris-protocol.workspace = true
cineris-base.workspace = true
cineris-policy.workspace = true
cineris-sandbox.workspace = true
cineris-tools.workspace = true

rquickjs = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
# The channel a script's runtime thread reports on to the call it serves.
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
# This crate's own tests run the engine. Not an edge of the crate table.
cineris-ext = { workspace = true, features = ["scripts"] }
cineris-testkit.workspace = true

[lints]
workspace = true
