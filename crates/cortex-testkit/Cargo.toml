[package]
name = "cortex-testkit"
description = "Test support: the scripted provider, the scripted SSE server, the virtual terminal, the pseudo-terminal driver, temporary workspaces and the fake clock. A dev-dependency only."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
cortex-protocol.workspace = true
# With `test-hooks`: the points library code marks for a test to hold
# (`cortex_base::hook`, `hold`). Only a build that has the test kit has them.
cortex-base = { workspace = true, features = ["test-hooks"] }
# The types and traits only. A test of the real HTTP transport turns the
# `http` feature on in the crate that owns it.
cortex-llm.workspace = true
# With `pty`: the pseudo-terminal under the driver in `pty`.
cortex-term = { workspace = true, features = ["pty"] }
serde_json.workspace = true

[lints]
workspace = true
