[package]
name = "cineris-base"
description = "Small shared primitives: error kinds, secrets, ids, clock and RNG traits, cancellation, workspace paths, text utilities, atomic file writes, message framing and the changed-file check."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
cineris-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-core.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true

# The no-follow open: the two flags of `open` that the standard library has
# no names for, `O_NOFOLLOW` and `O_NONBLOCK`. Used by one module,
# `nofollow`, through the standard library's safe `custom_flags`: no
# `unsafe`.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Owner-only files: an access list can only be set through the Windows API
# (docs/decisions/0029-owner-only-files-on-windows.md). Used by
# `private::windows`, one of the three modules of this crate where `unsafe`
# is allowed; `zone::windows` reads the time zone (`Win32_System_Time`). The
# no-follow open (`nofollow`) uses the flag constants of the storage family,
# and that module's one function that reads a reparse tag. Since the signed
# approvals step, `program_data::windows` reads the program data folder as
# the system records it, from the registry and the Windows directory
# (`Win32_System_Registry`, `Win32_System_SystemInformation`), so that the
# managed configuration's folder is not the `ProgramData` variable's. Both
# calls are in libraries every start loads already (advapi32, kernel32).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
] }

[features]
# Code for tests only: the `Hold` that makes library code stop at a point
# (`hook`). Without it a point is nothing at all. Only dev-dependencies and
# the test kit turn it on (`cargo xtask rules`).
test-hooks = []

[dev-dependencies]
# This crate's own tests ask for its own `test-hooks`: it cannot depend on the
# test kit, which depends on it. Not an edge of the crate table.
cineris-base = { workspace = true, features = ["test-hooks"] }

[lints]
workspace = true
