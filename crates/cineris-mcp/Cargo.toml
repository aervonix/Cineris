[package]
name = "cineris-mcp"
description = "The MCP client. Registers server tools with the dynamic-tool registry and reads other clients' server definitions."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
cineris-protocol.workspace = true
cineris-base.workspace = true
cineris-tools.workspace = true
cineris-sandbox.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# `rt` for the tasks that read a server's output and keep its change stream.
tokio = { workspace = true, features = ["rt", "sync"] }

[features]
# Fake MCP servers of both eras (`fake`), scripted, for any crate's tests,
# and a fake `Client` with no process and no protocol (`fake::client`): its
# tools a list, its answers scripted, a call that waits at a gate. Code for
# tests only: dev-dependencies turn it on, and nothing else may (`cargo
# xtask rules`).
test-kit = []

[dev-dependencies]
cineris-testkit.workspace = true
# The crate's integration tests use its own fake servers. Not an edge of the
# crate table.
cineris-mcp = { workspace = true, features = ["test-kit"] }

[lints]
workspace = true
