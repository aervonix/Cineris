# The blocking checks. They run on every pull request, on Linux and Windows,
# and each job must finish in under 5 minutes. After them, on a pull request,
# two jobs that block nothing: the shipped binary's size (`pr-size`) and the
# TypeScript client of the RPC protocol (`ts-client`), at the end.
#
# What a job runs is defined in the xtask crate, so `cargo xtask ci` runs the
# same thing locally. The layout, the reasons and the measured times are in
# docs/testing-and-ci.md. `cargo xtask rules` checks this file: actions pinned
# by commit hash, a read-only token, and no secret but the owner's protected
# terms, which the owner guard reads.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Keeps the main branch's caches from expiring (GitHub drops a cache that
  # has not been read for 7 days).
  schedule:
    - cron: "23 5 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"

# Every job starts by asking whether the pull request touches anything other
# than documentation (.github/actions/changes). If it does not, the job's
# remaining steps are skipped and the job still reports success under its own
# name, so the four checks can be required without a gate job. The one thing a
# documentation-only pull request still runs is the repo rules, on Linux: the
# check for home-directory paths and the check of docs/dependencies.md exist
# mostly for documentation.
jobs:
  # Tier 0. Formatting, the repo rules and cargo-deny are the same on every
  # OS and run once, on Linux. Clippy runs on both, so that code compiled
  # only for Windows is linted too.
  lint:
    name: lint-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            check: ""
          - name: windows
            os: windows-latest
            check: clippy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: changes
        uses: ./.github/actions/changes
      - name: Keep cargo's and rustup's files off the system disk (Windows)
        if: runner.os == 'Windows' && steps.changes.outputs.code == 'true'
        run: |
          "CARGO_HOME=$env:RUNNER_TEMP\cargo" >> $env:GITHUB_ENV
          "RUSTUP_HOME=$env:RUNNER_TEMP\rustup" >> $env:GITHUB_ENV
      - name: Install the toolchain from rust-toolchain.toml
        if: steps.changes.outputs.code == 'true' || matrix.name == 'linux'
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.changes.outputs.code == 'true' || matrix.name == 'linux'
        with:
          # Only the main branch writes caches. Pull requests read a cache
          # that is always consistent, and never push each other's out.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: "false"
      - name: Install cargo-deny
        if: steps.changes.outputs.code == 'true' && matrix.name == 'linux'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2
      - name: Static checks
        if: steps.changes.outputs.code == 'true'
        run: cargo run --locked --quiet --package xtask -- check ${{ matrix.check }}
      - name: Repo rules (documentation-only change)
        if: steps.changes.outputs.code != 'true' && matrix.name == 'linux'
        run: cargo run --locked --quiet --package xtask -- check rules
      # The owner's personal details (rule 3), looked for in what the pull
      # request, or the push to the main branch, adds: its lines, its paths
      # and its commits. The terms are a secret only the owner holds. Without
      # it (a fork, or a secret not set) the step passes with a warning.
      # It runs whatever happened in the steps before it.
      # docs/testing-and-ci.md, "The owner guard".
      - name: Owner guard
        if: ${{ !cancelled() && matrix.name == 'linux' && (github.event_name == 'pull_request' || github.event_name == 'push') }}
        env:
          OWNER_TERMS: ${{ secrets.OWNER_TERMS }}
          GUARD_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          GUARD_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # The checkout is two commits deep; the range needs its history.
          if [ -n "$OWNER_TERMS" ] && [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --no-tags --quiet --unshallow origin
          fi
          cargo run --locked --quiet --package xtask -- owner-guard --base "$GUARD_BASE" --head "$GUARD_HEAD"

  # Tiers 1 to 3.
  test:
    name: test-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Five minutes on a pull request: rule 2's budget. Twelve on every other
    # event, because only main saves the build cache and a run cut off saves
    # nothing: a main run must be able to rebuild from cold and save, or every
    # run after a cold start is cut off in turn (the first run after the
    # rename to Cineris built from cold for 3m22s on Windows and was cut off
    # 10 s into its tests). A cold lint job takes under 2.5 minutes, so the
    # lint jobs keep five.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 12 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: windows
            os: windows-latest
    env:
      # The build of the workspace's own crates, which the Windows job caches
      # beside rust-cache's third-party crates (docs/testing-and-ci.md, "The
      # workspace's own build, cached"): every file cargo made for a
      # `cineris-*` crate or xtask, by its package's name (`.fingerprint`,
      # `build`) or its target's (`deps`: the libraries and test binaries,
      # `it` and `system` among them), in the `ci` profile the tests build in
      # and the `dev` one `cargo run --package xtask` builds xtask in, with
      # the workspace crates xtask depends on (`cineris-protocol`). A file
      # these miss is not cached, and is built again: a miss costs time, never
      # a stale build.
      WORKSPACE_BUILD: |
        target/ci/.fingerprint/cineris-*
        target/ci/.fingerprint/xtask-*
        target/ci/build/cineris-*
        target/ci/deps/cineris*
        target/ci/deps/libcineris*
        target/ci/deps/xtask*
        target/ci/deps/it-*
        target/ci/deps/system-*
        target/ci/examples
        target/ci/cineris*
        target/ci/xtask*
        target/debug/.fingerprint/cineris-*
        target/debug/.fingerprint/xtask-*
        target/debug/build/cineris-*
        target/debug/deps/cineris*
        target/debug/deps/libcineris*
        target/debug/deps/xtask*
        target/debug/xtask*
    steps:
      # Two commits deep, for .github/actions/changes; dating the files
      # against a restored build fetches the one commit it needs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: changes
        uses: ./.github/actions/changes
      - name: Keep cargo's and rustup's files off the system disk (Windows)
        if: runner.os == 'Windows' && steps.changes.outputs.code == 'true'
        run: |
          "CARGO_HOME=$env:RUNNER_TEMP\cargo" >> $env:GITHUB_ENV
          "RUSTUP_HOME=$env:RUNNER_TEMP\rustup" >> $env:GITHUB_ENV
          # Temporary files too. Tests that need a directory with no
          # repository above it make it in the system's temporary
          # directory, which is on the system disk by default: with it on
          # the workspace's disk the tests of `cineris-core` took half the
          # time (docs/steps/11/ci.md, "Windows CI health").
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\tmp" | Out-Null
          "TEMP=$env:RUNNER_TEMP\tmp" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP\tmp" >> $env:GITHUB_ENV
      - name: Install the toolchain from rust-toolchain.toml
        if: steps.changes.outputs.code == 'true'
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.changes.outputs.code == 'true'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: "false"
      - name: Install cargo-nextest
        if: steps.changes.outputs.code == 'true'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.151
      # The build of the workspace's own crates that the main branch saved
      # last (the last step below), on Windows, where building them is most
      # of the job: a pull request then builds only the crates it changes and
      # what depends on them. Every run but the main branch's reads it; the
      # main branch builds every crate afresh and saves that, so a saved
      # build is always one commit's whole build. Only the main branch
      # writes it, as with rust-cache.
      #
      # Its key holds what decides the bytes a checkout writes without being
      # any file's content: git's line-ending settings and every attributes
      # file. A build made under other ones is not restored, since a file it
      # read could differ on disk with nothing in git saying so.
      - name: The checkout's settings, for the key of the workspace's build (Windows)
        id: checkout-settings
        if: runner.os == 'Windows' && steps.changes.outputs.code == 'true'
        shell: bash
        run: |
          hash=$({
            git config --get core.autocrlf || echo "no autocrlf"
            git config --get core.eol || echo "no eol"
            git ls-files -s -- ':(glob)**/.gitattributes'
            cat .git/info/attributes 2>/dev/null || echo "no info/attributes"
          } | sha256sum | cut -c1-16)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
      - name: Restore the main branch's build of the workspace's crates (Windows)
        id: workspace-build
        if: runner.os == 'Windows' && steps.changes.outputs.code == 'true' && github.ref != 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.WORKSPACE_BUILD }}
          key: workspace-build-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ steps.checkout-settings.outputs.hash }}-${{ github.sha }}
          restore-keys: workspace-build-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ steps.checkout-settings.outputs.hash }}-
      # Cargo judges a workspace crate's build by its files' dates, and a
      # checkout dates every file now: this dates them against the commit the
      # restored build was made from, which its key ends in, so that what
      # differs from it is rebuilt and nothing else. Anything it cannot work
      # out leaves the dates alone, and everything is rebuilt.
      - name: Date the checkout against that build (Windows)
        if: steps.workspace-build.outcome == 'success'
        shell: bash
        env:
          RESTORED: ${{ steps.workspace-build.outputs.cache-matched-key }}
        run: bash .github/scripts/date-the-checkout.sh "$RESTORED"
      - name: Tests
        if: steps.changes.outputs.code == 'true'
        # A hosted runner's disk goes with the job: the tests leave their
        # directories there, where removing them was 2.7 ms of each core
        # test on Windows (docs/steps/ci-budgets-2/answered.md).
        env:
          CINERIS_TESTKIT_KEEP_DIRECTORIES: "1"
        run: cargo run --locked --quiet --package xtask -- ci test
      # Said before anything else runs, so that a job the time limit cuts off
      # after this (while it uploads the report, say) is told apart from one
      # whose tests failed: the notice is on the run's page and in its
      # annotations.
      - name: Say that every test passed
        if: success() && steps.changes.outputs.code == 'true'
        shell: bash
        env:
          JOB: test-${{ matrix.name }}
        run: echo "::notice title=$JOB::Every test passed. A cancellation after this is the job's time limit, not a failure."
      # Every test's time, which the log does not show for a test under two
      # seconds. `cargo xtask ci --tiers --from junit.xml` reads it
      # (docs/testing-and-ci.md, "A CI run's test times"). It is kept when
      # the tests failed too: that is when it is wanted most.
      - name: Keep the JUnit report
        if: ${{ !cancelled() && steps.changes.outputs.code == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-${{ matrix.name }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 14
      # The main branch's build of the workspace's crates, for the runs
      # after it to restore (above), under a key that ends in its commit.
      # Saved when the tests passed: the build is whole then.
      - name: Save this build of the workspace's crates (Windows, main branch)
        if: success() && runner.os == 'Windows' && steps.changes.outputs.code == 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.WORKSPACE_BUILD }}
          key: workspace-build-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ steps.checkout-settings.outputs.hash }}-${{ github.sha }}

  # Not a required check, and not one of the blocking jobs: the shipped
  # binary's size on each system, against its budget and against the size
  # the `main` workflow last recorded, in the job's summary, so that a pull
  # request shows its size before it merges (docs/testing-and-ci.md, "Each
  # pull request's binary size"). Over the budget, it fails with a line that
  # says by how much.
  #
  # It starts only after the four required jobs have passed (`needs`), so it
  # never takes a runner they are waiting for, and a new push cancels it
  # with the rest of the run. A pull request that cannot change the binary
  # skips its build (.github/actions/changes, `binary`). No build cache, as
  # in the `main` workflow's size jobs: the caches here are the test jobs'.
  pr-size:
    name: pr-size-${{ matrix.name }}
    needs: [lint, test]
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # Reading another run's artifacts (`main`'s size records) takes
    # `actions: read`.
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - name: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: changes
        uses: ./.github/actions/changes
      - name: Keep cargo's and rustup's files off the system disk (Windows)
        if: runner.os == 'Windows' && steps.changes.outputs.binary == 'true'
        run: |
          "CARGO_HOME=$env:RUNNER_TEMP\cargo" >> $env:GITHUB_ENV
          "RUSTUP_HOME=$env:RUNNER_TEMP\rustup" >> $env:GITHUB_ENV
      - name: Install the toolchain from rust-toolchain.toml, and the target
        if: steps.changes.outputs.binary == 'true'
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      # As in the `main` workflow: ring's C code, built for the static
      # target, needs the musl C compiler.
      - name: Install the C compiler for the static target (Linux)
        if: steps.changes.outputs.binary == 'true' && contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
      - name: Release build, binary size against the budget and main
        if: steps.changes.outputs.binary == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
        # bash on both systems: in PowerShell, Windows' default, `$BASE` is
        # a variable of its own, empty, not the environment's.
        shell: bash
        run: cargo run --locked --quiet --package xtask -- size --check --target ${{ matrix.target }} --against-main --base "$BASE"

  # Not a required check, and not one of the blocking jobs: a client written
  # in TypeScript, which knows the protocol only from the generated
  # declarations, runs a turn against `cineris serve --stdio`
  # (docs/testing-and-ci.md, "The TypeScript client"). It needs Node, which
  # the blocking jobs do not have to have: there the test says it was not
  # run, and here `CINERIS_TS_CLIENT` makes it run or fail.
  #
  # On a pull request that changes the protocol, the server, the client or
  # this workflow, and when the workflow is started by hand. Like `pr-size`,
  # it starts only after the four required jobs have passed. It reads the
  # Linux test job's build cache (`shared-key: test`), so it builds only the
  # workspace's crates.
  ts-client:
    needs: [lint, test]
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      # On a pull request the checkout is a merge commit, whose first parent
      # is the base branch, as in .github/actions/changes. A list that
      # cannot be made runs the job.
      - name: Does the change reach the protocol or the client?
        id: reaches
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          reaches=true
          if [ "$EVENT" = "pull_request" ] && files=$(git diff --name-only --no-renames HEAD^1 HEAD); then
            reaches=false
            while IFS= read -r file; do
              case "$file" in
                crates/cineris-protocol/* | crates/cineris-rpc/* | docs/protocol/* | \
                crates/cineris-cli/tests/system/ts_client* | .github/workflows/ci.yml) reaches=true ;;
              esac
            done <<< "$files"
          fi
          echo "reaches=$reaches" >> "$GITHUB_OUTPUT"
          if [ "$reaches" = true ]; then
            echo "This run builds the binary and runs the TypeScript client."
          else
            echo "Nothing here reaches the protocol, the server or the client: the job's steps are skipped."
          fi
      - name: Install the toolchain from rust-toolchain.toml
        if: steps.reaches.outputs.reaches == 'true'
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.reaches.outputs.reaches == 'true'
        with:
          shared-key: test
          save-if: "false"
          cache-bin: "false"
      - name: Install cargo-nextest
        if: steps.reaches.outputs.reaches == 'true'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.151
      # The oldest Node that runs a `.ts` file as it is.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.reaches.outputs.reaches == 'true'
        with:
          node-version: 22.18.0
      # Node strips the types and checks none: the compiler checks the
      # client against the declarations as they are, so that a change to the
      # protocol the client no longer fits fails here. The compiler and
      # Node's types come from npm at the versions docs/dependencies.md pins,
      # into the runner's temporary folder, and nothing of them is kept.
      - name: Check the client's types against the declarations
        if: steps.reaches.outputs.reaches == 'true'
        run: |
          npm install --prefix "$RUNNER_TEMP/tsc" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund typescript@6.0.3 @types/node@22.18.13
          "$RUNNER_TEMP/tsc/node_modules/.bin/tsc" -p crates/cineris-cli/tests/system/ts_client --typeRoots "$RUNNER_TEMP/tsc/node_modules/@types"
      - name: Run a turn with the client
        if: ${{ !cancelled() && steps.reaches.outputs.reaches == 'true' }}
        env:
          CINERIS_TS_CLIENT: "1"
        run: cargo run --locked --quiet --package xtask -- test --locked -p cineris-cli --cargo-profile ci --test system -E 'test(=ts_client::sys_a_typescript_client_runs_a_turn)'
