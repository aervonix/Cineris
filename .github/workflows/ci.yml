# The blocking checks. They run on every pull request, on Linux and Windows,
# and each job must finish in under 5 minutes. After them, on a pull request,
# two jobs that block nothing: the shipped binary's size (`pr-size`) and the
# TypeScript client of the RPC protocol (`ts-client`), at the end.
#
# What a job runs is defined in the xtask crate, so `cargo xtask ci` runs the
# same thing at a desk. The layout, the reasons and the measured times are in
# docs/testing-and-ci.md. `cargo xtask rules` checks this file: actions pinned
# by commit hash, a read-only token, and no secret but the owner's protected
# terms, which the owner guard reads.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Keeps the main branch's caches from expiring (GitHub drops a cache that
  # has not been read for 7 days).
  schedule:
    - cron: "23 5 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"

# Every job starts by asking whether the pull request touches anything other
# than documentation (.github/actions/changes). If it does not, the job's
# remaining steps are skipped and the job still reports success under its own
# name, so the four checks can be required without a gate job. The one thing a
# documentation-only pull request still runs is the repo rules, on Linux: the
# check for home-directory paths and the check of docs/dependencies.md exist
# mostly for documentation.
jobs:
  # Tier 0. Formatting, the repo rules and cargo-deny are the same on every
  # OS and run once, on Linux. Clippy runs on both, so that code compiled
  # only for Windows is linted too.
  lint:
    name: lint-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            check: ""
          - name: windows
            os: windows-latest
            check: clippy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: changes
        uses: ./.github/actions/changes
      - name: Keep cargo's and rustup's files off the system disk (Windows)
        if: runner.os == 'Windows' && steps.changes.outputs.code == 'true'
        run: |
          "CARGO_HOME=$env:RUNNER_TEMP\cargo" >> $env:GITHUB_ENV
          "RUSTUP_HOME=$env:RUNNER_TEMP\rustup" >> $env:GITHUB_ENV
      - name: Install the toolchain from rust-toolchain.toml
        if: steps.changes.outputs.code == 'true' || matrix.name == 'linux'
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.changes.outputs.code == 'true' || matrix.name == 'linux'
        with:
          # Only the main branch writes caches. Pull requests read a cache
          # that is always consistent, and never push each other's out.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: "false"
      - name: Install cargo-deny
        if: steps.changes.outputs.code == 'true' && matrix.name == 'linux'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2
      - name: Static checks
        if: steps.changes.outputs.code == 'true'
        run: cargo run --locked --quiet --package xtask -- check ${{ matrix.check }}
      - name: Repo rules (documentation-only change)
        if: steps.changes.outputs.code != 'true' && matrix.name == 'linux'
        run: cargo run --locked --quiet --package xtask -- check rules
      # The owner's personal details (rule 3), looked for in what the pull
      # request, or the push to the main branch, adds: its lines, its paths
      # and its commits. The terms are a secret only the owner holds. Without
      # it (a fork, or a secret not set) the step passes with a warning.
      # It runs whatever happened in the steps before it.
      # docs/testing-and-ci.md, "The owner guard".
      - name: Owner guard
        if: ${{ !cancelled() && matrix.name == 'linux' && (github.event_name == 'pull_request' || github.event_name == 'push') }}
        env:
          OWNER_TERMS: ${{ secrets.OWNER_TERMS }}
          GUARD_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          GUARD_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # The checkout is two commits deep; the range needs its history.
          if [ -n "$OWNER_TERMS" ] && [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --no-tags --quiet --unshallow origin
          fi
          cargo run --locked --quiet --package xtask -- owner-guard --base "$GUARD_BASE" --head "$GUARD_HEAD"

  # Tiers 1 to 3.
  test:
    name: test-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: windows
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: changes
        uses: ./.github/actions/changes
      - name: Keep cargo's and rustup's files off the system disk (Windows)
        if: runner.os == 'Windows' && steps.changes.outputs.code == 'true'
        run: |
          "CARGO_HOME=$env:RUNNER_TEMP\cargo" >> $env:GITHUB_ENV
          "RUSTUP_HOME=$env:RUNNER_TEMP\rustup" >> $env:GITHUB_ENV
          # Temporary files too. Tests that need a directory with no
          # repository above it make it in the system's temporary
          # directory, which is on the system disk by default: with it on
          # the workspace's disk the tests of `cortex-core` took half the
          # time (docs/steps/11/ci.md, "Windows CI health").
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\tmp" | Out-Null
          "TEMP=$env:RUNNER_TEMP\tmp" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP\tmp" >> $env:GITHUB_ENV
      - name: Install the toolchain from rust-toolchain.toml
        if: steps.changes.outputs.code == 'true'
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.changes.outputs.code == 'true'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: "false"
      - name: Install cargo-nextest
        if: steps.changes.outputs.code == 'true'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.151
      - name: Tests
        if: steps.changes.outputs.code == 'true'
        run: cargo run --locked --quiet --package xtask -- ci test
      # Every test's time, which the log does not show for a test under two
      # seconds. `cargo xtask ci --tiers --from junit.xml` reads it
      # (docs/testing-and-ci.md, "A CI run's test times"). It is kept when
      # the tests failed too: that is when it is wanted most.
      - name: Keep the JUnit report
        if: ${{ !cancelled() && steps.changes.outputs.code == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-${{ matrix.name }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 14

  # Not a required check, and not one of the blocking jobs: the shipped
  # binary's size on each system, against its budget and against the size
  # the `main` workflow last recorded, in the job's summary, so that a pull
  # request shows its size before it merges (docs/testing-and-ci.md, "Each
  # pull request's binary size"). Over the budget, it fails with a line that
  # says by how much.
  #
  # It starts only after the four required jobs have passed (`needs`), so it
  # never takes a runner they are waiting for, and a new push cancels it
  # with the rest of the run. A pull request that cannot change the binary
  # skips its build (.github/actions/changes, `binary`). No build cache, as
  # in the `main` workflow's size jobs: the caches here are the test jobs'.
  pr-size:
    name: pr-size-${{ matrix.name }}
    needs: [lint, test]
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # Reading another run's artifacts (`main`'s size records) takes
    # `actions: read`.
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - name: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: changes
        uses: ./.github/actions/changes
      - name: Keep cargo's and rustup's files off the system disk (Windows)
        if: runner.os == 'Windows' && steps.changes.outputs.binary == 'true'
        run: |
          "CARGO_HOME=$env:RUNNER_TEMP\cargo" >> $env:GITHUB_ENV
          "RUSTUP_HOME=$env:RUNNER_TEMP\rustup" >> $env:GITHUB_ENV
      - name: Install the toolchain from rust-toolchain.toml, and the target
        if: steps.changes.outputs.binary == 'true'
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      # As in the `main` workflow: ring's C code, built for the static
      # target, needs the musl C compiler.
      - name: Install the C compiler for the static target (Linux)
        if: steps.changes.outputs.binary == 'true' && contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
      - name: Release build, binary size against the budget and main
        if: steps.changes.outputs.binary == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
        # bash on both systems: in PowerShell, Windows' default, `$BASE` is
        # a variable of its own, empty, not the environment's.
        shell: bash
        run: cargo run --locked --quiet --package xtask -- size --check --target ${{ matrix.target }} --against-main --base "$BASE"

  # Not a required check, and not one of the blocking jobs: a client written
  # in TypeScript, which knows the protocol only from the generated
  # declarations, runs a turn against `cortex serve --stdio`
  # (docs/testing-and-ci.md, "The TypeScript client"). It needs Node, which
  # the blocking jobs do not have to have: there the test says it was not
  # run, and here `CORTEX_TS_CLIENT` makes it run or fail.
  #
  # On a pull request that changes the protocol, the server, the client or
  # this workflow, and when the workflow is started by hand. Like `pr-size`,
  # it starts only after the four required jobs have passed. It reads the
  # Linux test job's build cache (`shared-key: test`), so it builds only the
  # workspace's crates.
  ts-client:
    needs: [lint, test]
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      # On a pull request the checkout is a merge commit, whose first parent
      # is the base branch, as in .github/actions/changes. A list that
      # cannot be made runs the job.
      - name: Does the change reach the protocol or the client?
        id: reaches
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          reaches=true
          if [ "$EVENT" = "pull_request" ] && files=$(git diff --name-only --no-renames HEAD^1 HEAD); then
            reaches=false
            while IFS= read -r file; do
              case "$file" in
                crates/cortex-protocol/* | crates/cortex-rpc/* | docs/protocol/* | \
                crates/cortex-cli/tests/system/ts_client* | .github/workflows/ci.yml) reaches=true ;;
              esac
            done <<< "$files"
          fi
          echo "reaches=$reaches" >> "$GITHUB_OUTPUT"
          if [ "$reaches" = true ]; then
            echo "This run builds the binary and runs the TypeScript client."
          else
            echo "Nothing here reaches the protocol, the server or the client: the job's steps are skipped."
          fi
      - name: Install the toolchain from rust-toolchain.toml
        if: steps.reaches.outputs.reaches == 'true'
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.reaches.outputs.reaches == 'true'
        with:
          shared-key: test
          save-if: "false"
          cache-bin: "false"
      - name: Install cargo-nextest
        if: steps.reaches.outputs.reaches == 'true'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.151
      # The oldest Node that runs a `.ts` file as it is.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.reaches.outputs.reaches == 'true'
        with:
          node-version: 22.18.0
      # Node strips the types and checks none: the compiler checks the
      # client against the declarations as they are, so that a change to the
      # protocol the client no longer fits fails here. The compiler and
      # Node's types come from npm at the versions docs/dependencies.md pins,
      # into the runner's temporary folder, and nothing of them is kept.
      - name: Check the client's types against the declarations
        if: steps.reaches.outputs.reaches == 'true'
        run: |
          npm install --prefix "$RUNNER_TEMP/tsc" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund typescript@6.0.3 @types/node@22.18.13
          "$RUNNER_TEMP/tsc/node_modules/.bin/tsc" -p crates/cortex-cli/tests/system/ts_client --typeRoots "$RUNNER_TEMP/tsc/node_modules/@types"
      - name: Run a turn with the client
        if: ${{ !cancelled() && steps.reaches.outputs.reaches == 'true' }}
        env:
          CORTEX_TS_CLIENT: "1"
        run: cargo run --locked --quiet --package xtask -- test --locked -p cortex-cli --cargo-profile ci --test system -E 'test(=ts_client::sys_a_typescript_client_runs_a_turn)'
