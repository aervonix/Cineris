# A run on the hosted runners for a branch that has no pull request yet.
#
# It runs one `cargo xtask` command on Linux, Windows or both, for any branch
# that has been pushed, and blocks nothing:
#
#   gh workflow run try --ref <branch> -f command=startup -f profile=dist
#   gh workflow run try --ref <branch> -f os=windows -f command="test -p cortex-tools shell::"
#   gh workflow run try --ref <branch> -f command="stress -p cortex-testkit" -f count=200 -f load=6 -f cores=2
#   gh workflow run try --ref <branch> -f command="test -p cortex-agent" -f filter="test(/denials/); test(=x)"
#   gh workflow run try --ref <branch> -f os=windows -f command=test -f against=main -f count=5
#   gh workflow run try --ref <branch> -f os=linux-22.04 -f command="test -p cortex-sandbox"
#   gh workflow run try --ref <branch> -f os=windows -f command="perf -p cortex-index"
#   gh workflow run try --ref <branch> -f os=windows -f command="perf -p cortex-index" -f against=main
#   gh workflow run try --ref <branch> -f command="size --check --against-main"
#   gh workflow run try --ref <branch> -f os=linux -f command="size --breakdown --top 40"
#   gh workflow run try --ref <branch> -f os=linux-22.04 -f command=partial-landlock
#   gh workflow run try --ref <branch> -f os=linux -f command=ci
#   gh workflow run try --ref <branch> -f os=windows -f command=test -f testkit=profile
#   gh workflow run try --ref <branch> -f os=windows -f command=test -f testkit=starts
#   gh workflow run try --ref <branch> -f os=windows -f command="test --dependents -p cortex-config"
#   gh workflow run try --ref <branch> -f os=windows -f command="mutate tooling-7 --jobs 2"
#   gh workflow run try --ref <branch> -f commit=<40-digit commit hash> -f command="test -p cortex-base"
#   ci-wait --workflow try                    (from the branch, for its head commit)
#
# `commit` makes the branch's side of the run that commit (and not the
# branch's head), so that a variant needs no branch of its own: commit each
# variant on one branch, each on top of the last, push, and dispatch with
# each commit's hash. The workflow file is the ref's; the commit's own `xtask`
# runs the command, so the commit must contain this workflow's `try`. `cargo
# xtask try --dry-run --command "..."` shows, at a desk, the command the job
# would run and fails as the job would.
#
# The inputs reach `cargo xtask try` as arguments, through the environment,
# and never as text in a script. `try` checks them and chooses the command:
# docs/testing-and-ci.md, "A run on the runners without a pull request", has
# the rules. The output is printed in the run's summary, and the JUnit
# reports and the log are kept as artifacts. `cargo xtask rules` checks this
# file as it does the others: actions pinned by commit hash, a read-only
# token, and no input in a script.
name: try

on:
  workflow_dispatch:
    inputs:
      os:
        description: "Where to run it."
        type: choice
        options: [both, linux, windows, linux-22.04]
        default: both
      command:
        description: "test [-p CRATE] [--dependents] [FILTER], stress -p CRATE [ARGS], startup, size [--check] [--against-main] [--breakdown] [--target T], perf [ARGS], perf -p CRATE (its ignored perf_ tests, in release), ci [ARGS], mutate BREAK... [--jobs N], or a nightly job: partial-landlock, advisories, unused."
        required: true
        default: "test"
      profile:
        description: "The cargo profile: ci (the blocking jobs' build), release or dist. startup needs release or dist; for size, ci is its own (dist)."
        type: choice
        options: [ci, release, dist]
        default: ci
      count:
        description: "Repeats: a stress run's count (test becomes stress), or startup's runs. Empty: the command's own."
        required: false
        default: ""
      load:
        description: "Busy loops beside a stress run. Empty: none."
        required: false
        default: ""
      cores:
        description: "Pin a stress run to this many cores. Empty: every core."
        required: false
        default: ""
      filter:
        description: "nextest filter expressions for test or stress, separated by ;. Empty: none."
        required: false
        default: ""
      against:
        description: "A ref to compare the branch with, both run in turn on one runner (count rounds), for test or perf -p CRATE. Empty: no comparison."
        required: false
        default: ""
      commit:
        description: "A full 40-digit commit hash to run in place of the ref's head (its own xtask runs the command, so it must contain this try). Empty: the ref's head."
        required: false
        default: ""
      capture:
        description: "yes: nextest keeps a passing test's output, as it does in CI. no: it is shown in the log (--no-capture, the tests one at a time), for test or stress, not with against."
        type: choice
        options: ["yes", "no"]
        default: "yes"
      testkit:
        description: "A test-kit switch for the tests: profile (CORTEX_TESTKIT_PROFILE, each test's report kept as a file), starts (CORTEX_TESTKIT_STARTS, each process a test starts written down); neither with against. none: nothing set."
        type: choice
        options: [none, profile, starts]
        default: none

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"

jobs:
  # The job's id and its environment are those of the blocking test job, on
  # purpose: the build cache's key is made of them, so a run in the `ci`
  # profile restores the cache the main branch wrote for `test-linux` or
  # `test-windows` and builds only what the branch changed. It never writes
  # a cache. A release or dist build has no cache, and builds from scratch.
  test:
    name: try-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Not a blocking check: a dist build from scratch takes most of this on
    # Windows. A mutate run builds copies of the tree from cold and runs to
    # its end. A comparison of two trees' performance tests builds both in
    # release from scratch.
    timeout-minutes: ${{ startsWith(inputs.command, 'mutate') && 90 || (startsWith(inputs.command, 'perf') && inputs.against != '' && 60 || 40) }}
    # `size --against-main` reads the main workflow's size record, which is
    # another run's artifact: `actions: read`, and the token below, which is
    # given to a `size` command only.
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # linux-22.04: Landlock ABI 4, the partial case no other runner has.
        include: ${{ fromJSON(inputs.os == 'linux' && '[{"name":"linux","os":"ubuntu-latest"}]' || inputs.os == 'windows' && '[{"name":"windows","os":"windows-latest"}]' || inputs.os == 'linux-22.04' && '[{"name":"linux-22.04","os":"ubuntu-22.04"}]' || '[{"name":"linux","os":"ubuntu-latest"},{"name":"windows","os":"windows-latest"}]') }}
    steps:
      # A commit is checked before it is used, and before anything is
      # built: the shell reads it from the environment. `cargo xtask try`
      # checks it again, and that the checkout is at it.
      - name: Check the commit's name
        if: inputs.commit != ''
        shell: bash
        env:
          TRY_COMMIT: ${{ inputs.commit }}
        run: |
          if ! [[ "$TRY_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit: the full 40 hexadecimal digits of a hash, in lower case" >&2
            exit 1
          fi
      # No token is kept in the checkout: what an A/B run builds may be any
      # ref's code, and nothing here pushes. With no `commit` the ref is
      # empty, which is the ref the run was dispatched on.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Keep cargo's and rustup's files off the system disk (Windows)
        if: runner.os == 'Windows'
        run: |
          "CARGO_HOME=$env:RUNNER_TEMP\cargo" >> $env:GITHUB_ENV
          "RUSTUP_HOME=$env:RUNNER_TEMP\rustup" >> $env:GITHUB_ENV
          # Temporary files too, as in the blocking test job.
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\tmp" | Out-Null
          "TEMP=$env:RUNNER_TEMP\tmp" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP\tmp" >> $env:GITHUB_ENV
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      # `size` on Linux builds the static target the budgets are of, as the
      # main workflow does: the target, and the musl C compiler that ring's C
      # code is built with. Fixed commands: nothing typed reaches them.
      - name: Install the static target and its C compiler (size, Linux)
        if: runner.os == 'Linux' && startsWith(inputs.command, 'size')
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
      # Not on 22.04: the cache's key names the OS and not its version, and
      # build scripts built on the newer image do not run on the older one.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: matrix.name != 'linux-22.04'
        with:
          save-if: "false"
          cache-bin: "false"
      # An A/B run's other tree, built in a directory of its own (`cargo
      # xtask ab`). The checkout can only be made inside the workspace, so it
      # is moved beside it: inside, the branch's .cargo/config.toml would
      # apply to its build too.
      - name: Check out the ref to compare with
        if: inputs.against != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.against }}
          path: ab-base
          persist-credentials: false
      - name: Put it beside the branch's checkout
        if: inputs.against != ''
        shell: bash
        run: mv ab-base ../ab-base
      - name: Install cargo-nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.151
      # `perf -p CRATE` measures real code: the pinned corpus (`corpus/`),
      # which `cargo xtask try` fetches before it builds anything and checks
      # against its hash. It is kept on the runner's temporary disk, the one
      # the workspace is on, so that a measured tree can hard-link its files
      # (on Windows the user's cache folder is on the system disk). Fetched
      # each time: about 5 to 15 s at a desk, and no cache to key and keep.
      - name: Keep the corpus of real code beside the workspace
        if: startsWith(inputs.command, 'perf')
        shell: bash
        run: echo "CORTEX_CORPUS_DIR=$RUNNER_TEMP/corpus" >> "$GITHUB_ENV"
      # `ci` runs `check`, whose last step is cargo-deny, and the nightly's
      # `advisories` is cargo-deny too; its `unused` is cargo-machete. Both
      # are prebuilt binaries the action checks against its checksums, at
      # the versions the other workflows pin. The condition reads the
      # command's words with spaces around them, so `test -p x-ci` does not
      # match (a word `ci` anywhere does, which only installs a tool);
      # `cargo xtask try` decides what runs.
      - name: Install cargo-deny
        if: contains(format(' {0} ', inputs.command), ' ci ') || contains(format(' {0} ', inputs.command), ' advisories ')
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2
      - name: Install cargo-machete
        if: contains(format(' {0} ', inputs.command), ' unused ')
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-machete@0.9.2
      # The log is kept in the runner's temporary folder, and nothing is made
      # under `target` before cargo makes it. On Windows the command runs in
      # PowerShell, as the blocking test job's does: run from Git Bash, with
      # `target/try` made first by its `mkdir`, Windows tests of a file held
      # with no sharing failed there that pass in the blocking job
      # (docs/steps/tooling-3/ci.md).
      - name: Run (Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TRY_COMMAND: ${{ inputs.command }}
          TRY_PROFILE: ${{ inputs.profile }}
          TRY_COUNT: ${{ inputs.count }}
          TRY_LOAD: ${{ inputs.load }}
          TRY_CORES: ${{ inputs.cores }}
          TRY_FILTER: ${{ inputs.filter }}
          TRY_AGAINST: ${{ inputs.against }}
          TRY_COMMIT: ${{ inputs.commit }}
          TRY_CAPTURE: ${{ inputs.capture }}
          # Only a `size` command is given the token, to read `main`'s record.
          GH_TOKEN: ${{ startsWith(inputs.command, 'size') && github.token || '' }}
          # The test kit's switches, from a list: each is set or left empty.
          CORTEX_TESTKIT_PROFILE: ${{ inputs.testkit == 'profile' && inputs.against == '' && '1' || '' }}
          CORTEX_TESTKIT_PROFILE_DIR: ${{ inputs.testkit == 'profile' && inputs.against == '' && format('{0}/target/testkit-profile', github.workspace) || '' }}
          CORTEX_TESTKIT_STARTS: ${{ inputs.testkit == 'starts' && inputs.against == '' && format('{0}/target/testkit-starts', github.workspace) || '' }}
        run: |
          set -o pipefail
          # The inputs added since a commit was made are passed only when
          # they are not their defaults, so that `-f commit` runs an older
          # commit's own `try`, which does not know them, for the others.
          added=()
          if [ -n "$TRY_COMMIT" ]; then added+=(--commit "$TRY_COMMIT"); fi
          if [ "$TRY_CAPTURE" = "no" ]; then added+=(--capture no); fi
          cargo run --locked --quiet --package xtask -- try \
            --command "$TRY_COMMAND" --profile "$TRY_PROFILE" \
            --count "$TRY_COUNT" --load "$TRY_LOAD" --cores "$TRY_CORES" \
            --filter "$TRY_FILTER" --against "$TRY_AGAINST" \
            "${added[@]}" \
            2>&1 | tee "$RUNNER_TEMP/try-output.log"
      - name: Run (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TRY_COMMAND: ${{ inputs.command }}
          TRY_PROFILE: ${{ inputs.profile }}
          TRY_COUNT: ${{ inputs.count }}
          TRY_LOAD: ${{ inputs.load }}
          TRY_CORES: ${{ inputs.cores }}
          TRY_FILTER: ${{ inputs.filter }}
          TRY_AGAINST: ${{ inputs.against }}
          TRY_COMMIT: ${{ inputs.commit }}
          TRY_CAPTURE: ${{ inputs.capture }}
          GH_TOKEN: ${{ startsWith(inputs.command, 'size') && github.token || '' }}
          CORTEX_TESTKIT_PROFILE: ${{ inputs.testkit == 'profile' && inputs.against == '' && '1' || '' }}
          CORTEX_TESTKIT_PROFILE_DIR: ${{ inputs.testkit == 'profile' && inputs.against == '' && format('{0}\target\testkit-profile', github.workspace) || '' }}
          CORTEX_TESTKIT_STARTS: ${{ inputs.testkit == 'starts' && inputs.against == '' && format('{0}\target\testkit-starts', github.workspace) || '' }}
        run: |
          # A line cargo writes to its standard error is not an error here.
          $ErrorActionPreference = 'Continue'
          # As on Linux: the inputs added since a commit was made only when
          # they are not their defaults.
          $added = @()
          if ($env:TRY_COMMIT -ne '') { $added += @('--commit', $env:TRY_COMMIT) }
          if ($env:TRY_CAPTURE -eq 'no') { $added += @('--capture', 'no') }
          cargo run --locked --quiet --package xtask -- try `
            --command "$env:TRY_COMMAND" --profile "$env:TRY_PROFILE" `
            --count "$env:TRY_COUNT" --load "$env:TRY_LOAD" --cores "$env:TRY_CORES" `
            --filter "$env:TRY_FILTER" --against "$env:TRY_AGAINST" `
            @added `
            2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath "$env:RUNNER_TEMP\try-output.log"
          exit $LASTEXITCODE
      - name: Put the end of the output in the summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/try-output.log" ]; then
            {
              echo "### The last 80 lines of the output"
              echo
              echo '```text'
              tail -n 80 "$RUNNER_TEMP/try-output.log" | sed 's/\x1b\[[0-9;]*m//g'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Keep the reports and the log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: try-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/try-output.log
            target/nextest/ci/junit.xml
            target/nextest/stress/junit.xml
            target/nextest/perf/junit.xml
            target/ab/*.xml
            target/ab/wall-times.json
            target/perf-ab/results.json
            target/size/*.json
            target/testkit-profile/
            target/testkit-starts/
            target/mutate/results.jsonl
            target/mutate/logs/
          if-no-files-found: ignore
          retention-days: 14
